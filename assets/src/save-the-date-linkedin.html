<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Save the Date – LinkedIn (1080×1350)</title>
<link rel="stylesheet" href="brand.css">
<style>
  body { width: 1080px; height: 1350px; background: var(--white); position: relative; }
  .board { position: absolute; left: 0; right: 0; top: 0; height: 760px; background: var(--grey); }
  .logo { position: absolute; left: 72px; top: 72px; width: 430px; }

  .std { width: 340px; height: 310px; left: 92px; top: 230px; font-size: 78px; transform: rotate(-6deg); }
  .t1 { width: 220px; height: 200px; left: 560px; top: 200px; font-size: 38px; transform: rotate(4deg); }
  .t2 { width: 220px; height: 200px; left: 800px; top: 300px; font-size: 38px; transform: rotate(-4deg); }
  .t3 { width: 220px; height: 200px; left: 590px; top: 470px; font-size: 38px; transform: rotate(-3deg); }

  .arrow { position: absolute; left: 0; top: 0; width: 1080px; height: 760px; }

  .date { position: absolute; left: 66px; top: 800px; font-size: 172px; color: var(--red); font-weight: 600; }
  .title { position: absolute; left: 74px; top: 990px; font-size: 64px; color: var(--navy); font-weight: 600; }
  .meta { position: absolute; left: 76px; top: 1082px; font-size: 34px; line-height: 1.45; font-weight: 500; color: var(--navy); }
  .meta b { font-weight: 800; }
  .cta { position: absolute; left: 72px; bottom: 64px; font-size: 34px; padding: 22px 40px; }
</style>
</head>
<body>
  <div class="board"></div>
  <img class="logo" src="img/wud-logo.png" alt="World Usability Day">

  <svg class="arrow" viewBox="0 0 1080 760" aria-hidden="true">
    <path d="M450 330 C 490 290, 510 290, 540 300" stroke-width="6" stroke-dasharray="14 13"/>
    <polyline class="tip" points="522,282 542,300 520,316" stroke-width="6"/>
    <path d="M450 440 C 500 520, 530 560, 570 565" stroke-width="6" stroke-dasharray="14 13"/>
    <polyline class="tip" points="550,546 572,565 548,580" stroke-width="6"/>
    <path d="M900 520 C 900 580, 870 610, 830 615" stroke-width="6" stroke-dasharray="14 13"/>
    <polyline class="tip" points="850,598 828,615 850,632" stroke-width="6"/>
  </svg>

  <div class="sticky std">Save the Date!</div>
  <div class="sticky t1">Open Space Sessions</div>
  <div class="sticky t2">Keynote</div>
  <div class="sticky dashed t3">Deine Session?</div>

  <div class="head date">12.11.2026</div>
  <div class="head title">World Usability Day Mannheim</div>
  <div class="meta"><b>Donnerstag, 14–19 Uhr</b> · inkl. Get Together<br>C-Hub Mannheim, Hafenstraße 25</div>

  <div class="pill cta">Kostenlos anmelden: wud-ma.de</div>
</body>
</html>
