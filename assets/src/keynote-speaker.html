<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Keynote-Speaker – Post (1080×1350)</title>
<link rel="stylesheet" href="brand.css">
<style>
  body { width: 1080px; height: 1350px; background: var(--white); position: relative; }
  .board { position: absolute; left: 0; right: 0; top: 0; height: 740px; background: var(--grey); }

  .kicker { position: absolute; left: 72px; top: 72px; font-weight: 800; font-size: 28px; letter-spacing: .08em; text-transform: uppercase; }
  .logo { position: absolute; right: 72px; top: 62px; width: 330px; }

  .photo { position: absolute; left: 50%; top: 150px; width: 520px; height: 520px; margin-left: -260px; border-radius: 50%;
           box-shadow: 0 0 0 12px var(--white), 0 0 0 18px var(--red), 0 40px 60px -30px rgba(0,4,39,.45); }
  .photo img { width: 100%; height: 100%; border-radius: 50%; display: block; }

  .note-key { width: 250px; height: 230px; left: 112px; top: 450px; font-size: 54px; transform: rotate(-7deg); flex-direction: column; gap: 8px; }
  .note-key small { font-size: 34px; color: var(--red); }

  .name { position: absolute; left: 72px; top: 790px; font-size: 108px; color: var(--red); }
  .role { position: absolute; left: 76px; top: 912px; font-size: 38px; font-weight: 700; }
  .talk { position: absolute; left: 76px; top: 980px; right: 72px; font-family: var(--font-head); font-weight: 600; font-size: 44px; line-height: 1.15; color: var(--navy); }
  .talk:empty { display: none; }
  .meta { position: absolute; left: 76px; font-size: 31px; line-height: 1.45; font-weight: 500; top: 1000px; }
  .has-talk .meta { top: 1112px; }
  .meta b { font-weight: 800; }
  .cta { position: absolute; left: 72px; bottom: 64px; font-size: 32px; padding: 20px 38px; }
</style>
</head>
<body>
  <!-- ▼ Vortragstitel hier eintragen, sobald er feststeht (leer lassen = keine Titelzeile) -->
  <script>const TALK_TITLE = "";</script>

  <div class="board"></div>
  <div class="kicker" id="kicker">Unsere Keynote</div>
  <img class="logo" src="img/wud-logo.png" alt="World Usability Day">

  <div class="photo"><img src="img/speaker-uwe-thimel.png" alt="Uwe Thimel"></div>
  <div class="sticky note-key">Keynote<small>15:30 Uhr</small></div>

  <div class="head name">Uwe Thimel</div>
  <div class="role">Chief Creative Officer, inovex</div>
  <div class="talk" id="talk"></div>
  <div class="meta"><b>World Usability Day Mannheim</b><br>Do, 12.11.2026 · 14–19 Uhr · C-Hub Mannheim · kostenlos</div>
  <div class="pill cta" id="cta">Jetzt anmelden: wud-ma.de</div>

  <script>
    const talk = document.getElementById('talk');
    if (TALK_TITLE) { talk.textContent = "„" + TALK_TITLE + "“"; document.body.classList.add('has-talk'); }
    // Variante zum Teilen für den Speaker selbst
    if (location.hash === '#teilen') {
      document.getElementById('kicker').textContent = 'Ich halte die Keynote';
      document.getElementById('cta').textContent = 'Sei dabei: wud-ma.de';
    }
  </script>
</body>
</html>
